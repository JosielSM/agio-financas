<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#079668">
  <title>CredMais | Segurança da conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="email-action-page">
    <section class="email-action-card" aria-live="polite">
      <div class="email-action-brand"><span class="brand-mark">C</span><strong>CredMais</strong></div>
      <div id="actionLoading"><span class="eyebrow">CONTA SEGURA</span><h1>Validando seu link...</h1><p>Aguarde um instante enquanto o CredMais confirma seus dados.</p><span class="loader-spinner" aria-hidden="true"></span></div>
      <div id="actionMessage" hidden><span class="auth-state-icon" id="actionIcon">✉</span><span class="eyebrow" id="actionEyebrow">CONTA SEGURA</span><h1 id="actionTitle"></h1><p id="actionDescription"></p><a class="primary" id="actionHome" href="./">Voltar para o CredMais</a></div>
      <div id="resetAction" hidden><span class="auth-state-icon">⌘</span><span class="eyebrow">NOVA SENHA</span><h1>Crie uma nova senha</h1><p id="resetAccount">Escolha uma senha segura para voltar a acessar sua conta.</p><form id="resetPasswordForm" class="email-action-action"><label>Nova senha<span class="password-field"><input id="actionPassword" type="password" autocomplete="new-password" minlength="6" required><button type="button" class="password-toggle" data-password-toggle="actionPassword" aria-label="Mostrar senha">◉</button></span></label><label>Confirmar nova senha<span class="password-field"><input id="actionPasswordConfirm" type="password" autocomplete="new-password" minlength="6" required><button type="button" class="password-toggle" data-password-toggle="actionPasswordConfirm" aria-label="Mostrar senha">◉</button></span></label><p class="form-feedback" id="actionFeedback"></p><button class="primary" type="submit">Salvar nova senha</button></form></div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth-action.js"></script>
</body>
</html>
